name: BLOCO WAR - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install --save-dev @capacitor/assets

      - name: Verificar configuração
        run: |
          echo "=== capacitor.config.ts ==="
          cat capacitor.config.ts
          echo ""
          echo "=== package.json ==="
          cat package.json

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar versão web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar ícones Android
        run: npx capacitor-assets generate --android

      - name: Configurar modo paisagem
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if 'android:screenOrientation="landscape"' not in text:
              text = text.replace(
                  '<activity android:name=".MainActivity"',
                  '<activity android:name=".MainActivity" android:screenOrientation="landscape"',
                  1
              )

          manifest.write_text(text)
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCO-WAR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
